<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner de Entradas</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 0; background: #f4f4f9; }
    nav { background: #333; padding: 12px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    nav a { color: white; text-decoration: none; padding: 8px 12px; background: #444; border-radius: 5px; font-size: 0.9rem; font-weight: bold; }
    nav a.active { background: #007bff; }
    .content { padding: 20px; }
    #reader { width: 100%; max-width: 400px; margin: auto; background: white; padding: 10px; border-radius: 8px; }
    #resultado { margin-top: 20px; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; display: none; }
    .exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="active">📷 Escáner</a>
    <a href="/crear.html" class="btn-protegido">➕ Generar Ticket</a>
    <a href="/lista.html" class="btn-protegido">📋 Lista</a>
  </nav>

  <div class="content">
    <h2>Control de Acceso</h2>
    <div id="reader"></div>
    <div id="resultado"></div>
  </div>

  <script>
    // 1. Protección con contraseña para los enlaces con la clase .btn-protegido
    document.querySelectorAll('.btn-protegido').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault(); // Evita que abra la página de inmediato
        const password = prompt("🔒 Ingresa la contraseña de administrador:");
        
        if (password === "1234") { // Cambia "1234" por tu contraseña real si lo deseas
          window.location.href = this.href;
        } else if (password !== null) {
          alert("❌ Contraseña incorrecta");
        }
      });
    });

    // 2. Lógica del escáner QR
    const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });

    async function onScanSuccess(qrToken) {
      scanner.pause();
      const resDiv = document.getElementById('resultado');
      resDiv.style.display = 'block';
      resDiv.className = '';
      resDiv.innerText = "Validando en servidor...";

      try {
        const response = await fetch('/api/escanear', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'bypass-tunnel-reminder': 'true'
          },
          body: JSON.stringify({ id: qrToken })
        });

        if (!response.ok) {
          const errorText = await response.text();
          resDiv.className = 'error';
          resDiv.innerText = `Error: ${errorText}`;
          setTimeout(() => { resDiv.style.display = 'none'; scanner.resume(); }, 3500);
          return;
        }

        const data = await response.json();

        if (data.valido) {
          resDiv.className = 'exito';
          resDiv.innerText = data.mensaje;
        } else {
          resDiv.className = 'error';
          resDiv.innerText = data.mensaje;
        }
      } catch (err) {
        resDiv.className = 'error';
        resDiv.innerText = "Error de conexión con el servidor";
      }

      setTimeout(() => {
        resDiv.style.display = 'none';
        scanner.resume();
      }, 3500);
    }

    scanner.render(onScanSuccess);
  </script>
</body>
</html>
